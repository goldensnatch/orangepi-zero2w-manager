services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: rocky-media-radarr
    network_mode: "container:rocky-transfer-gluetun"
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./radarr-config:/config
      - /mnt/rocky-transfer/complete:/downloads/complete
      - /mnt/rocky-media/movies:/movies

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: rocky-media-sonarr
    network_mode: "container:rocky-transfer-gluetun"
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./sonarr-config:/config
      - /mnt/rocky-transfer/complete:/downloads/complete
      - /mnt/rocky-media/tv:/tv

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: rocky-media-bazarr
    network_mode: "container:rocky-transfer-gluetun"
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./bazarr-config:/config
      - /mnt/rocky-media/movies:/movies
      - /mnt/rocky-media/tv:/tv

  stashapp:
    image: stashapp/stash:latest
    container_name: rocky-media-stashapp
    network_mode: "container:rocky-transfer-gluetun"
    restart: unless-stopped
    environment:
      STASH_STASH: /data
      STASH_GENERATED: /generated
      STASH_METADATA: /metadata
      STASH_CACHE: /cache
    volumes:
      - ./stash-config:/root/.stash
      - /mnt/rocky-media:/data
      - ./stash-generated:/generated
      - ./stash-metadata:/metadata
      - ./stash-cache:/cache
