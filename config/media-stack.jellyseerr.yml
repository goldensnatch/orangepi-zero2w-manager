# Merged with runtime/media-stack/docker-compose.yml.
# Bind-mount /app/config so setup survives restarts, and alias jellyfin
# to the host gateway. Jellyseerr 2.7.3 treats a failed TCP/DNS lookup as
# INVALID_URL 404; compose service DNS often does not reach a host-network
# or published Jellyfin on :8096.
services:
  jellyseerr:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jellyfin:host-gateway"
    volumes:
      - ./jellyseerr-config:/app/config
