# Rocky generates runtime/media-stack/docker-compose.jellyseerr.yml from this
# shape, substituting a literal Docker bridge IP (not host-gateway).
# host.docker.internal does not resolve in the Jellyseerr image on Linux.
services:
  jellyseerr:
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
      - "jellyfin:172.17.0.1"
    volumes:
      - ./jellyseerr-config:/app/config
